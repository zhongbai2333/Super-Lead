pluginManagement {
    def useLocalModBench = providers.gradleProperty('modBenchLocal')
            .map { it.toBoolean() }
            .orElse(false)
            .get()
    def modBenchVersion = providers.gradleProperty('modbench_version').get()

    repositories {
        if (useLocalModBench) {
            mavenLocal {
                content {
                    includeGroup 'com.zhongbai233.bench'
                }
            }
        } else {
            maven {
                name = 'JitPack'
                url = 'https://jitpack.io'
                content {
                    includeGroup 'com.github.zhongbai2333.BenchMod'
                }
            }
        }
        if (providers.gradleProperty('useMavenLocal').map { it.toBoolean() }.orElse(false).get()) {
            mavenLocal()
        }
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
    plugins {
        id 'com.zhongbai233.minecraft-bench' version modBenchVersion
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.zhongbai233.minecraft-bench') {
                def group = useLocalModBench
                        ? 'com.zhongbai233.bench'
                        : 'com.github.zhongbai2333.BenchMod'
                useModule("${group}:bench-gradle-plugin:${modBenchVersion}")
            }
        }
    }
}

plugins {
    // 1.0.0+ is required on Gradle 9: 0.8.0 references JvmVendorSpec.IBM_SEMERU,
    // which Gradle 9 removed, and crashes every toolchain resolution.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
