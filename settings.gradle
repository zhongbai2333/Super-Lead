pluginManagement {
    repositories {
        // ModBench is consumed from the local Maven repository per its
        // consumer-quickstart: run `gradlew publishToMavenLocal` in ../BenchMod
        // after changing it. The plugin requires a Java 25 daemon — provided by
        // gradle/gradle-daemon-jvm.properties, which makes every gradlew
        // invocation (IDE included) select a 25 JVM regardless of JAVA_HOME.
        mavenLocal {
            content {
                includeGroup 'com.zhongbai233.bench'
                includeGroup 'com.zhongbai233.minecraft-bench'
            }
        }
        if (providers.gradleProperty('useMavenLocal').map { it.toBoolean() }.orElse(false).get()) {
            mavenLocal()
        }
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
    plugins {
        id 'com.zhongbai233.minecraft-bench' version providers.gradleProperty('modbench_version').get()
    }
}

plugins {
    // 1.0.0+ is required on Gradle 9: 0.8.0 references JvmVendorSpec.IBM_SEMERU,
    // which Gradle 9 removed, and crashes every toolchain resolution.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
